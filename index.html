const lessons=[
{id:'h1',unit:0,title:'六个基本元音',subtitle:'认识 ㅏ ㅓ ㅗ ㅜ ㅡ ㅣ，开始读韩文',minutes:14,goals:['识别六个基础元音','理解字母必须组合成音节块','读出 아、어、오、우 等字'],words:[['ㅏ','a，口张大','a'],['ㅓ','eo，舌位偏后','eo'],['ㅗ','o，嘴唇圆','o'],['ㅜ','u，嘴唇圆','u'],['ㅡ','eu，嘴角较平','eu'],['ㅣ','i，类似“衣”','i'],['아','a，元音音节','a'],['어','eo，元音音节','eo'],['오','o，元音音节','o'],['우','u，元音音节','u'],['이','i，元音音节','i']],grammar:[['韩文字不是逐个字母横排','韩语使用音节方块。一个音节通常由「首声辅音 + 元音」，有时还会加上末尾的收音构成。元音不能单独构成规范的韩文字块，开头没有辅音时用不发音的 ㅇ 占位。',['아 = ㅇ + ㅏ','ㅇ 在开头不发音，所以 아 读作 a。'],'本课重点是认形与拼读，中文拟音只能辅助，不能替代真实韩语发音。'],['元音的排布方向','ㅏ、ㅓ、ㅣ 属于竖形元音，放在首声的右边；ㅗ、ㅜ、ㅡ 属于横形元音，放在首声的下面。',['오 = ㅇ + ㅗ','ㅗ 放在 ㅇ 下方，合成一个音节块。'],'对比听 ㅓ 与 ㅗ，不要把两者都读成汉语“哦”。']],sentences:[['아, 어, 오, 우','先连读这四个元音音节','元音音节'],['아이','小孩','아 + 이'],['우유','牛奶','우 + 유（유 会在后面学）']],questions:[C('下面哪个元音通常写作罗马字 eo？',['ㅏ','ㅓ','ㅗ','ㅜ'],1,'ㅓ 对应 eo；ㅗ 通常对应 o。'),C('哪个符号用来占据元音音节开头，且不发声？',['ㄴ','ㅇ','ㅁ','ㅂ'],1,'ㅇ 在音节开头不发音。'),T('用韩文字母写出元音 a（只写字母，不加 ㅇ）','ㅏ','答案是 ㅏ。'),C('选择能与 ㅇ 组合成 오 的元音',['ㅜ','ㅓ','ㅗ','ㅡ'],2,'오 = ㅇ + ㅗ。'),L('우',['o','u','i','a'],1,'우 = ㅇ + ㅜ，发 u 的音。'),O('依次点击，拼出表示“孩子”的 아이',['아','이'],'아이 由 아 + 이 两个音节构成。')]},
{id:'h2',unit:0,title:'八个核心辅音',subtitle:'从 ㄱ ㄴ ㄷ ㄹ 到 가 나 다',minutes:16,goals:['认识八个常用辅音','分清横向/纵向拼写','拼读简单音节'],words:[['ㄱ','g/k，软腭塞音','g/k'],['ㄴ','n','n'],['ㄷ','d/t','d/t'],['ㄹ','r/l，闪音或边音','r/l'],['ㅁ','m','m'],['ㅂ','b/p','b/p'],['ㅅ','s，后接 ㅣ 时类似 sh','s'],['ㅎ','h','h'],['가','ga','ga'],['나','na','na'],['다','da','da'],['마','ma','ma'],['바','ba','ba'],['사','sa','sa'],['하','ha','ha']],grammar:[['首声 + 元音 = 音节','字母不能像拼音那样简单并排。ㄱ + ㅏ → 가；ㄴ + ㅗ → 노。发音会受到位置、气流和相邻音影响。',['가 / 나 / 다','ga / na / da，先把字形对应起来。'],'初学阶段不要把 ㄱ、ㄷ、ㅂ 固定等同于汉语拼音 g、d、b。'],['ㅗ、ㅜ、ㅡ 在下面','例如 ㄴ + ㅜ → 누；ㅁ + ㅡ → 므。韩文方块是空间组合，而不是从左到右逐个打印字母。',['누 = ㄴ + ㅜ','nu（练习把整体字块一眼认出来）。'],'每天朗读 5 分钟，比只记罗马音更重要。']],sentences:[['가 나 다 라 마','五个简单字块连读','识字练习'],['나','我（非敬语）','常见代词'],['바다','大海','바 + 다']],questions:[C('哪个辅音表示 n 音？',['ㄱ','ㄷ','ㄴ','ㅁ'],2,'ㄴ 常对应 n。'),C('ㄹ + ㅏ 可以组成什么？',['라','로','러','루'],0,'ㄹ + ㅏ → 라。'),T('请写出 ㄴ + ㅏ 组合后的音节','나','ㄴ 与 ㅏ 组成 나。'),L('마',['ma','na','sa','ha'],0,'마 的首声是 ㅁ，元音是 ㅏ。'),O('按顺序拼出“大海”的韩语 바다',['바','다'],'바다 = 바 + 다。'),C('下面哪个字块的元音在首声下面？',['가','나','모','다'],2,'모 由 ㅁ + ㅗ 组成，ㅗ 放在下方。')]},
{id:'h3',unit:0,title:'松音、送气音和紧音',subtitle:'认识 ㅇ、ㅋ、ㅌ、ㅍ、ㅊ 与双辅音',minutes:19,goals:['理解 ㅇ 在开头和收音位置的区别','初步区别松音、送气音、紧音','识别更多常见辅音'],words:[['ㅇ','首声无音；作收音为 ng','ng'],['ㅋ','k，送气较明显','k'],['ㅌ','t，送气较明显','t'],['ㅍ','p，送气较明显','p'],['ㅊ','ch，送气较明显','ch'],['ㅈ','j','j'],['ㄲ','kk，紧音','kk'],['ㄸ','tt，紧音','tt'],['ㅃ','pp，紧音','pp'],['ㅆ','ss，紧音','ss'],['ㅉ','jj，紧音','jj'],['카','ka','ka'],['차','cha','cha'],['아','a','a']],grammar:[['三种气流/发声对比','ㄱ / ㅋ / ㄲ 都涉及相近的发音部位，但发声方式不同：ㄱ 是松音；ㅋ 送气明显；ㄲ 紧音。不要简单把紧音理解成“读两遍”。',['가 · 카 · 까','分别听松音、送气音和紧音。'],'浏览器 TTS 不一定能清楚展示每一组差别，建议反复模仿。'],['ㅇ 的两个身份','在 아、오 这种音节开头，ㅇ 不发声；在 강、공 这种音节末尾，ㅇ 发 ng。',['아 / 강','아 的 ㅇ 静音；강 的 ㅇ 是尾音 ng。'],'一个字母因为位置不同，发音可能不一样。']],sentences:[['가 · 카 · 까','松音 / 送气音 / 紧音','辨音练习'],['자 · 차 · 짜','另一组对比','辨音练习'],['강','江、河','末尾 ㅇ = ng']],questions:[C('哪一个字母是 ㄱ 对应的送气音？',['ㄲ','ㅋ','ㄴ','ㅁ'],1,'ㅋ 是送气音；ㄲ 是紧音。'),C('강 的最后一个 ㅇ 通常发什么？',['不发声','ng','m','s'],1,'ㅇ 在收音位置发 ng。'),T('写出 ㅊ + ㅏ 组合成的音节','차','ㅊ + ㅏ = 차。'),C('下面哪个是紧音字母？',['ㅍ','ㅋ','ㄲ','ㅌ'],2,'ㄲ 是紧音。'),L('카',['가','카','까','나'],1,'卡读作 카，注意送气。'),O('按顺序拼出“汽车”韩语 차（此处单个音节）',['차'],'차 是一个音节，本题练习识别它。')]},
{id:'h4',unit:0,title:'复合元音与收音入门',subtitle:'读懂 한국、책、학교 这样的词',minutes:23,goals:['认识常见复合元音','理解末尾辅音 받침（收音）','开始读短词'],words:[['ㅐ','ae，现代标准韩语与 ㅔ 发音很接近','ae'],['ㅔ','e','e'],['ㅘ','wa','wa'],['ㅝ','wo','wo'],['ㅢ','ui（实际读音随环境变化）','ui'],['ㅑ','ya','ya'],['ㅕ','yeo','yeo'],['ㅛ','yo','yo'],['ㅠ','yu','yu'],['책','书','chaek'],['한국','韩国','hanguk'],['학교','学校','hakgyo'],['우유','牛奶','uyu'],['이름','名字','ireum'],['사람','人','saram']],grammar:[['复合元音不是两段慢慢念','ㅘ = ㅗ + ㅏ，ㅝ = ㅜ + ㅓ，发音是一个音节的元音。其他如 ㅐ、ㅔ 在现代口语中常难分辨。',['와 / 워 / 왜','练习把复合元音作为一个整体读出。'],'ㅢ 的实际发音会随词内位置变化，初学先掌握识字。'],['받침：字块下方的收音','책 的 ㄱ 是收音；한 的 ㄴ 是收音；국 的 ㄱ 是收音。单词连读时某些辅音还会发生连音、鼻音化等变化，不要完全依赖罗马音。',['한 + 국 = 한국','两个音节块组成一个词，한국 = 韩国。'],'例如 한국어 通常会连读为接近「한구거」的效果。']],sentences:[['한국 사람','韩国人','两个名词组合'],['책이 있어요.','有书。','后面会学主格助词 이 与 있다'],['학교에 가요.','去学校。','后面会学地点助词 에']],questions:[C('下列哪个复合元音通常写作 wa？',['ㅝ','ㅐ','ㅘ','ㅢ'],2,'ㅘ 对应 wa。'),C('“책” 的收音是哪一个？',['ㅊ','ㅐ','ㄱ','ㅇ'],2,'책 = ㅊ + ㅐ + ㄱ。'),T('用韩语写出“韩国”','한국','한국 是“韩国”。'),L('우유',['学校','牛奶','名字','书'],1,'우유 表示牛奶。'),O('排列音节，组成“学校”',['학','교'],'학교 = 学校。'),C('现代标准韩语中，哪组元音发音经常非常接近？',['ㅏ 和 ㅜ','ㅐ 和 ㅔ','ㅗ 和 ㅣ','ㅓ 和 ㅡ'],1,'ㅐ / ㅔ 在现代口语中往往接近。')]},
{id:'g1',unit:1,title:'韩语语序与基础助词',subtitle:'SOV、은/는、을/를 与「是」',minutes:24,goals:['理解“主语—宾语—谓语”的常见语序','区分主语助词 은/는 与宾语助词 을/를','用 이에요/예요 介绍身份'],words:[['저','我（谦称）','jeo'],['나','我（非敬语）','na'],['학생','学生','haksaeng'],['선생님','老师','seonsaengnim'],['사람','人','saram'],['물','水','mul'],['밥','饭','bap'],['책','书','chaek'],['먹다','吃（词典形）','meokda'],['마시다','喝（词典形）','masida'],['이것','这个东西','igeot'],['친구','朋友','chingu']],grammar:[['语序：S（主语）+ O（宾语）+ V（动词）','汉语说“我喝水”，韩语常说“我（水）喝”：저는 물을 마셔요。韩语谓语通常放在句末，助词标示词语在句中的角色。',['저는 물을 마셔요.','我喝水。'],'저 + 는（主语）/ 물 + 을（宾语）/ 마셔요（喝）。'],['은/는 与 을/를','名词末音节没有收音：主语用 는、宾语用 를；有收音：主语用 은、宾语用 을。例：저는、책은、사과를、물을。',['저는 책을 읽어요.','我读书。'],'은/는 更准确地说是“主语助词”，不等同于一切语境中的主语助词。'],['名词 + 이에요/예요','表示“是……”的日常礼貌体：前面的名词有收音接 이에요，无收音接 예요。更正式的说法还可以用 입니다。',['저는 학생이에요.','我是学生。'],'학생 有收音 ㅇ，因此用 이에요；의사 无收音，因此用 예요。']],sentences:[['저는 학생이에요.','我是学生。','主语 + 名词谓语'],['저는 물을 마셔요.','我喝水。','主宾谓结构'],['이것은 책이에요.','这是书。','主语助词 은']],questions:[C('韩语普通陈述句的谓语通常放在哪里？',['句首','句中','句末','固定在主语前'],2,'韩语常采用主语—宾语—谓语结构，谓语在句末。'),C('저 后面接主语助词，应选什么？',['은','는','을','를'],1,'저 无收音，所以用 는。'),T('“我是学生”的自然礼貌体韩语', ['저는 학생이에요','저는 학생이에요.'],'학생 有收音，接 이에요。'),O('按顺序组成“我喝水”',['저는','물을','마셔요'],'저는 물을 마셔요。'),C('물 后面接宾语助词，应选什么？',['를','는','을','가'],2,'물 有收音 ㄹ，接 을。'),L('이것은 책이에요.',['这是书。','那是水。','我喝水。','我是老师。'],0,'이것은 책이에요 = 这是书。')]},
{id:'g2',unit:1,title:'主格助词与「有 / 在」',subtitle:'이/가、있다、없다、地点 에',minutes:22,goals:['区分 이/가 与 은/는','表达有和没有','表达某人/物在哪里'],words:[['집','家','jip'],['학교','学校','hakgyo'],['방','房间','bang'],['가방','包','gabang'],['돈','钱','don'],['시간','时间','sigan'],['고양이','猫','goyangi'],['개','狗','gae'],['여기','这里','yeogi'],['거기','那里','geogi'],['있다','有；在','itda'],['없다','没有；不在','eopda']],grammar:[['이/가：标示主格','名词有收音接 이，无收音接 가。이/가 通常帮助指出谁/什么是句子的主语；은/는 则经常提示对比或谈论的主语。',['고양이가 있어요.','有一只猫。'],'고양이 无收音 + 가；책 有收音 + 이。'],['있어요 / 없어요：有、没有、存在','있다 与 없다 是词典形；在日常礼貌体常用 있어요 / 없어요。可搭配 이/가 来讲某物有无。',['시간이 없어요.','没有时间。'],'시간 的最后一个音节有收音 ㄴ，接 이。'],['地点 + 에 있어요','说“在学校/家里”常用 장소 + 에 + 있어요。这里的 에 标示存在的位置。',['저는 집에 있어요.','我在家。'],'地点 + 에，后接 있다/없다；表达在某地进行动作时常用 에서，后面再学。']],sentences:[['가방이 있어요.','有包。','主格 이'],['고양이가 없어요.','没有猫。','主格 가'],['저는 학교에 있어요.','我在学校。','处所 에']],questions:[C('고양이 后面的主格助词应选？',['이','가','을','은'],1,'고양이 无收音，用 가。'),T('翻译：“我在家。”',['저는 집에 있어요','집에 있어요'],'저는 집에 있어요。主语可根据上下文省略。'),C('下面哪个表示“没有时间”？',['시간이 있어요','시간은 먹어요','시간이 없어요','시간을 가요'],2,'없어요 表示没有、不在。'),O('排列成“有书”',['책이','있어요'],'책이 있어요。'),L('고양이가 있어요.',['猫不在。','有一只猫。','我有狗。','猫在学校。'],1,'고양이가 있어요 表示有猫。'),C('“학교에 있어요” 中 에 表示？',['宾语','存在的地点','对比','否定'],1,'에 在此标记所处位置。')]},
{id:'g3',unit:1,title:'动词、形容词与所有格',subtitle:'좋다、좋아하다、의 的区别',minutes:23,goals:['区分动作动词与描述性形容词','理解 좋다 和 좋아하다 的不同句法','用 의 表达所属'],words:[['좋다','好；令人喜欢（描述性）','jota'],['좋아하다','喜欢（动作动词）','joahada'],['크다','大','keuda'],['작다','小','jakda'],['예쁘다','漂亮','yeppeuda'],['빠르다','快','ppareuda'],['날씨','天气','nalssi'],['음악','音乐','eumak'],['영화','电影','yeonghwa'],['한국어','韩语','hangugeo'],['제','我的（저의 缩写）','je'],['이름','名字','ireum']],grammar:[['词典形通常以 다 结尾','韩语动词与描述性形容词在词典中一般以 다 结尾。如 먹다（吃），크다（大）。实际说话时常需要变形，例如 먹어요、커요。',['방이 커요.','房间很大。'],'这里 커요 由 크다 变来，是描述状态的谓语。'],['좋다 和 좋아하다 并不一样','좋다 是“好/让人喜欢”的描述性形容词，常见搭配是 N이/가 좋아요；좋아하다 是“喜欢”的动作动词，通常搭配 N을/를 좋아해요。',['저는 음악을 좋아해요.','我喜欢音乐。'],'音乐用宾语助词 을。也可说 저는 음악이 좋아요，句法不同。'],['의：连接所属关系','A의 B = A 的 B。저의 在日常表达里常缩写为 제；나의 常写成 내。口语中有些 의 可以省略。',['제 이름은 민지예요.','我的名字叫敏智。'],'名字민지为示例人名；“의”口语发音与拼写可能不同。']],sentences:[['오늘 날씨가 좋아요.','今天天气很好。','좋다'],['저는 영화를 좋아해요.','我喜欢电影。','좋아하다'],['이것은 제 가방이에요.','这是我的包。','제 = 저의']],questions:[C('“我喜欢音乐”选哪句？',['저는 음악이 먹어요.','저는 음악을 좋아해요.','저는 음악을 있어요.','저는 음악을 커요.'],1,'좋아하다 是动作动词，常接 을/를。'),C('제 在 “제 이름” 中相当于什么？',['我的','你们的','这里的','有'],0,'제 是 저의（我的）的常见缩略形式。'),T('翻译“天气好。”',['날씨가 좋아요','날씨가 좋아요.'],'날씨가 좋아요。'),O('组成“这是我的包”',['이것은','제','가방이에요'],'이것은 제 가방이에요。'),L('저는 영화를 좋아해요.',['我喜欢电影。','我在看电影。','我有电影。','电影很大。'],0,'영화를 좋아해요 = 喜欢电影。'),C('크다 属于哪一类？',['地点助词','描述性形容词','数词','过去式'],1,'크다 表示“大”，是描述状态的形容词。')]},
{id:'g4',unit:1,title:'形容词修饰名词',subtitle:'-(으)ㄴ、많은、도',minutes:21,goals:['把形容词放到名词前作定语','正确识别 ㄴ/은','使用 도 表示“也”'],words:[['예쁜','漂亮的','yeppeun'],['작은','小的','jageun'],['큰','大的','keun'],['많은','很多的','maneun'],['새','新的','sae'],['책','书','chaek'],['사과','苹果','sagwa'],['사람','人','saram'],['친구','朋友','chingu'],['도','也（助词）','do'],['맛있다','好吃','masitda'],['비싸다','贵','bissada']],grammar:[['形容词如何放在名词前？','规则形容词词干无收音接 ㄴ，有收音接 은：크다 → 큰；작다 → 작은。예쁘다 → 예쁜。不是把词典形 다 直接放在名词前。',['작은 집','小房子。'],'작 + 은 = 작은；少数形容词存在不规则变化，后续继续学。'],['많다 → 많은','많다 的定语形是 많은；많은 사람 = 很多人。韩语名词前面常放表示数量、状态的定语。',['많은 친구','很多朋友。'],'많다 → 많은，注意 ㅎ 与复杂收音的实际书写。'],['도：也、还','도 通常接在名词后，用来表达“也”。当 도 承担相应角色时，常替代原来的 은/는、이/가、을/를 等助词。',['저도 학생이에요.','我也是学生。'],'저도 而不是 저도는。']],sentences:[['큰 가방이 있어요.','有一个大包。','큰 修饰 가방'],['예쁜 꽃이에요.','是漂亮的花。','예쁜 修饰 꽃'],['저도 한국어를 배워요.','我也学韩语。','도 表示也']],questions:[C('“小房子”应说？',['작다 집','작은 집','작는 집','작을 집'],1,'작다 的名词修饰形是 작은。'),C('“我也是学生”应说？',['저도 학생이에요.','저는도 학생이에요.','저를도 학생이에요.','저가도 학생이에요.'],0,'도 可以直接接 저 后面。'),T('把 크다 变成修饰名词的形式','큰','크다 → 큰。'),O('排列成“很多朋友”',['많은','친구'],'많은 친구。'),L('큰 가방이 있어요.',['有一个大包。','大包不见了。','我买了包。','小包很贵。'],0,'큰 = 大的；가방이 있어요 = 有包。'),C('“漂亮的”通常是哪一种？',['예쁘다','예쁜','예뻐요','예쁩니다'],1,'예쁜 可直接放在名词前修饰。')]},
{id:'g5',unit:1,title:'现在、过去与将来',subtitle:'-아요/-어요、-았/-었어요、-(으)ㄹ 거예요',minutes:28,goals:['掌握常用礼貌体现在时','表达已经发生的事','表达未来计划或推测'],words:[['오늘','今天','oneul'],['어제','昨天','eoje'],['내일','明天','naeil'],['지금','现在','jigeum'],['가다','去','gada'],['오다','来','oda'],['보다','看','boda'],['먹다','吃','meokda'],['공부하다','学习','gongbuhada'],['만나다','见面','mannada'],['읽다','读','ikda'],['시간','时间','sigan']],grammar:[['现在礼貌体：아요/어요','去掉词典形的 다，看词干最后一个元音：通常 ㅏ/ㅗ 接 아요，其余接 어요；하다 通常变 해요。实际还会合并/缩写：가다 → 가요，보다 → 봐요，먹다 → 먹어요。',['저는 공부해요.','我学习。'],'这只是基础规则，存在不规则变化。'],['过去：았/었어요','在相应词干后使用过去时词尾。가다 → 갔어요，먹다 → 먹었어요，하다 → 했어요。',['어제 밥을 먹었어요.','昨天吃饭了。'],'注意 어제（昨天）和过去时搭配。'],['未来：-(으)ㄹ 거예요','词干无收音一般接 ㄹ 거예요，有收音一般接 을 거예요；ㄹ 收音及不规则变化需要单独处理。가다 → 갈 거예요；먹다 → 먹을 거예요。',['내일 학교에 갈 거예요.','明天要去学校。'],'它可以表达计划、意图或推测；不是所有未来表达都只用这一种。']],sentences:[['지금 책을 읽어요.','现在读书。','现在'],['어제 영화를 봤어요.','昨天看电影了。','过去'],['내일 친구를 만날 거예요.','明天要见朋友。','将来']],questions:[C('가다 的常用现在礼貌体是？',['가다요','가요','갈 거예요','갔어요'],1,'가다 → 가요。'),C('“昨天去了”应选？',['어제 가요','어제 갈 거예요','어제 갔어요','어제 가다'],2,'过去式 갔어요。'),T('먹다 的礼貌体过去式','먹었어요','먹다 → 먹었어요。'),O('排列成“明天我要去学校”',['내일','학교에','갈 거예요'],'내일 학교에 갈 거예요。'),L('어제 영화를 봤어요.',['明天想看电影。','昨天看电影了。','现在看书。','昨天吃饭了。'],1,'어제 = 昨天；봤어요 = 看了。'),C('하다 的常用现在礼貌体是？',['하요','해요','했어요','하이에요'],1,'하다 → 해요。')]},
{id:'g6',unit:1,title:'礼貌体与敬语入门',subtitle:'해요体、합니다体、常见尊敬表达',minutes:23,goals:['根据对象选择礼貌程度','区分 해요体 与 합니다体','掌握常用礼貌表达'],words:[['안녕하세요','您好 / 你好','annyeonghaseyo'],['감사합니다','谢谢（正式）','gamsahamnida'],['고마워요','谢谢（礼貌）','gomawoyo'],['죄송합니다','对不起（正式）','joesonghamnida'],['주세요','请给我','juseyo'],['네','是；好的','ne'],['아니요','不；不是','aniyo'],['말씀','话语（敬语词）','malsseum'],['드시다','吃/喝（敬语动词）','deusida'],['먹어요','吃（해요体）','meogeoyo'],['먹습니다','吃（합니다体）','meokseumnida'],['이름','名字','ireum']],grammar:[['해요体：日常礼貌表达','在许多日常场合，与不熟悉的人交流时常用 해요体。它比非敬语的 해体更礼貌。例：먹어요、가요、좋아요。',['커피를 마셔요.','（我）喝咖啡。'],'해요体是句尾表达礼貌的一种方式，不等于所有敬语。'],['합니다体：更正式的语体','正式发言、工作汇报等场合常出现 합니다体。动词词干无收音一般接 ㅂ니다，有收音一般接 습니다。例如 가다 → 갑니다；먹다 → 먹습니다。',['저는 한국어를 공부합니다.','我学习韩语。（正式）'],'否定、疑问句还有相应的形式，本课先认识陈述句。'],['尊敬对象的表达','除了句尾礼貌程度，韩语还可以通过动词和主语尊敬词尾表达对句中人物的尊敬。例如“吃”在尊敬对象时可用 드시다。敬语需看说话对象与句子主体。',['선생님이 식사하세요.','老师在用餐。'],'日常情境可先熟练使用 안녕하세요、감사합니다、죄송합니다。']],sentences:[['안녕하세요?','您好？','问候'],['물 주세요.','请给我水。','请求'],['저는 회사원입니다.','我是公司职员。（正式）','입니다']],questions:[C('日常对不熟悉的人说“你好”最常用？',['안녕','안녕하세요','잘 가','미안'],1,'안녕하세요 是常见礼貌问候。'),C('먹다 的 합니다体陈述式是？',['먹어요','먹습니다','먹었어요','먹는'],1,'词干 먹- 有收音，接 습니다。'),T('把 가다 变为正式陈述体','갑니다','가 + ㅂ니다 → 갑니다。'),O('排列成“请给我水”',['물','주세요'],'물 주세요。'),L('감사합니다.',['谢谢。','对不起。','再见。','可以吗？'],0,'감사합니다 是正式的感谢。'),C('“드시다”与下列哪个含义相关？',['尊敬对象的吃/喝','正式睡觉','非敬语再见','否定动词'],0,'드시다 是吃/喝的尊敬词。')]},
{id:'g7',unit:1,title:'常见不规则变形',subtitle:'ㄷ、ㅂ、르 的第一批例子',minutes:25,goals:['识别为什么有些词不按基础规则变化','掌握 듣다、춥다、모르다 的变形','避免将不规则规则套到全部词上'],words:[['듣다','听','deutda'],['들어요','听（现在礼貌体）','deureoyo'],['걷다','走路','geotda'],['걸어요','走路（现在礼貌体）','georeoyo'],['춥다','冷','chupda'],['추워요','冷（现在礼貌体）','chuwoyo'],['덥다','热','deopda'],['더워요','热（现在礼貌体）','deowoyo'],['모르다','不知道','moreuda'],['몰라요','不知道（现在礼貌体）','mollayo'],['쉽다','容易','swipda'],['쉬워요','容易（现在礼貌体）','swiwoyo']],grammar:[['ㄷ 不规则（部分动词）','以 ㄷ 收音结尾的部分词干遇到元音开头的词尾时，ㄷ 变为 ㄹ：듣다 → 들어요；걷다 → 걸어요。不是所有 ㄷ 结尾词都这样，例如 받다 → 받아요。',['음악을 들어요.','听音乐。'],'牢记具体词的变形，不要以结尾字母机械判断。'],['ㅂ 不规则（部分形容词/动词）','部分词干的 ㅂ 在元音开头的词尾前变成 우/오：춥다 → 추워요；덥다 → 더워요。存在规则词，例如 입다 → 입어요。',['오늘은 추워요.','今天冷。'],'少数如 돕다 → 도와요 有不同形式；本课先记高频词。'],['르 不规则（部分词）','部分以 르 结尾的词在 아/어 前出现 ㄹ 的添加及 ㅡ 脱落：모르다 → 몰라요。',['저는 몰라요.','我不知道。'],'词典形和实际变形要成对记忆。']],sentences:[['저는 음악을 들어요.','我听音乐。','ㄷ 不规则'],['오늘은 더워요.','今天热。','ㅂ 不规则'],['저는 잘 몰라요.','我不太清楚。','르 不规则']],questions:[C('듣다 的现在礼貌体是？',['듣어요','들어요','들아요','듣아요'],1,'듣다 → 들어요（ㄷ → ㄹ）。'),C('춥다 的现在礼貌体是？',['춥어요','추어요','추워요','춥아요'],2,'춥다 → 추워요。'),T('모르다 → 现在礼貌体','몰라요','모르다 → 몰라요。'),O('排列成“我听音乐”',['저는','음악을','들어요'],'저는 음악을 들어요。'),L('오늘은 더워요.',['今天冷。','今天热。','今天刮风。','今天下雨。'],1,'더워요 = 热。'),C('下列哪个 ㄷ 结尾动词通常保持 ㄷ 不变？',['듣다','걷다','받다','묻다（问）'],2,'받다 → 받아요；并非所有 ㄷ 结尾词都不规则。')]},
{id:'g8',unit:1,title:'副词与否定句',subtitle:'안、못、잘、많이',minutes:22,goals:['用 안 表达“不做”','理解 못 表示“不能/无法”','用副词说明程度、频率和方式'],words:[['안','不（否定副词）','an'],['못','不能；没能','mot'],['잘','好好地；擅长','jal'],['많이','很多地；经常大量','mani'],['빨리','快地','ppalli'],['천천히','慢慢地','cheoncheonhi'],['자주','经常','jaju'],['항상','总是','hangsang'],['가끔','偶尔','gakkeum'],['오늘','今天','oneul'],['수영','游泳','suyeong'],['바쁘다','忙','bappeuda']],grammar:[['안：直接否定','通常放在动词、形容词前面，表示“不……”。例：안 가요（不去），안 좋아요（不好）。하다 类动词常说 공부를 안 해요 / 공부 안 해요，而不是所有情况下都直接把 안 放在最前面。',['저는 오늘 안 가요.','我今天不去。'],'안 主要表示否定，并不直接表示能力不足。'],['못：无法做到','못 常表示能力或客观条件使动作无法完成。못 가요 = 去不了；잘 못해요 = 做得不太好/不擅长，具体要看语境。',['저는 수영을 못 해요.','我不会/不能游泳。'],'못 用在描述性形容词前通常不自然；不要把 안 与 못 当成完全同义词。'],['副词放在被修饰成分前','빨리 가요（快去），천천히 먹어요（慢慢吃），자주 만나요（经常见面）。顺序可能因焦点变化调整。',['저는 한국어를 열심히 공부해요.','我努力学习韩语。'],'副词一般不需要像动词一样进行时态变形。']],sentences:[['오늘은 안 바빠요.','今天不忙。','안 + 形容词'],['저는 자주 운동해요.','我经常运动。','频率副词'],['저는 한국어를 잘 못해요.','我的韩语不太好。','잘 못하다']],questions:[C('“我今天不去”的自然说法？',['저는 오늘 안 가요.','저는 오늘 못 좋아요.','저는 오늘 가다 안.','저는 오늘 아니 가요.'],0,'안 + 가요 表示不去。'),C('“去不了（能力或情况不允许）”更适合？',['안 가요','못 가요','가요','가고'],1,'못 常表示无法做到。'),T('翻译“慢慢地”','천천히','천천히 = 慢慢地。'),O('排列成“我经常运动”',['저는','자주','운동해요'],'저는 자주 운동해요。'),L('저는 오늘 안 가요.',['我今天去。','我明天去。','我今天不去。','我今天不能吃。'],2,'안 가요 = 不去。'),C('빨리 是什么词性？',['助词','副词','名词','过去时'],1,'빨리 表示快地，是副词。')]},
{id:'a1',unit:2,title:'「是」与「不是」',subtitle:'이에요/예요、아니에요、疑问语调',minutes:19,goals:['更熟练地使用“是……”的句式','正确表达“不是……”','用语调提问身份'],words:[['의사','医生','uisa'],['학생','学生','haksaeng'],['회사원','公司职员','hoesawon'],['선생님','老师','seonsaengnim'],['한국인','韩国人','hangugin'],['중국인','中国人','junggugin'],['아니다','不是（词典形）','anida'],['아니에요','不是（礼貌体）','anieyo'],['맞아요','对；是这样的','majayo'],['직업','职业','jigeop'],['누구','谁','nugu'],['이름','名字','ireum']],grammar:[['이에요 与 예요 再巩固','名词有收音 + 이에요：학생이에요；无收音 + 예요：의사예요。问句中只要语调上扬，也可以成为疑问。',['의사예요?','是医生吗？'],'不是 의사이에요；학생通常接 이에요。'],['不是：N이/가 아니에요','否定身份常用 名词 + 이/가 + 아니에요。名词有收音接 이，无收音接 가。例如 학생이 아니에요 / 의사가 아니에요。',['저는 의사가 아니에요.','我不是医生。'],'아니에요 是正确拼写，不要写成 아니예요。'],['回答是或不是','네（是/对），아니요（不/不是）。口语中还会用 맞아요（对）或 아니에요（不是）。',['네, 맞아요.','是的，没错。'],'韩语 네、아니요 是对对方说法的肯否，反问句需结合语境理解。']],sentences:[['저는 중국인이에요.','我是中国人。','身份句'],['저는 학생이 아니에요.','我不是学生。','否定身份'],['선생님이에요?','您是老师吗？','疑问语调']],questions:[C('의사 后面接“是……”礼貌体应选？',['이에요','예요','아니에요','은'],1,'의사 无收音，所以接 예요。'),T('“不是” 的常用礼貌体（完整词）','아니에요','正确拼写：아니에요。'),C('以下哪句拼写正确？',['학생이 아니예요','학생이 아니에요','학생 아니이다','학생이 안이에요'],1,'아니에요 的 에 不能写成 예。'),O('排列成“我不是医生”',['저는','의사가','아니에요'],'저는 의사가 아니에요。'),L('저는 중국인이에요.',['我是韩国人。','我是中国人。','我不是中国人。','我去中国。'],1,'중국인 = 中国人。'),C('“学生吗？”最自然的礼貌问法？',['학생이에요?','학생예요?','학생아니?','학생을?'],0,'학생 有收音，用 학생이에요?。')]},
{id:'a2',unit:2,title:'数字、量词与时间',subtitle:'固有数词 vs 汉字数词',minutes:26,goals:['分清两套数字体系的常见场景','使用 个、名 等量词','表达整点和分钟'],words:[['하나','一（固有数词）','hana'],['둘','二（固有数词）','dul'],['셋','三（固有数词）','set'],['넷','四（固有数词）','net'],['한 개','一个','han gae'],['두 명','两个人','du myeong'],['일','一（汉字数词）','il'],['이','二（汉字数词）','i'],['삼','三（汉字数词）','sam'],['십','十（汉字数词）','sip'],['시','点（时刻单位）','si'],['분','分（分钟）','bun'],['사과','苹果','sagwa'],['몇','几；多少','myeot']],grammar:[['两套数字：根据场景选择','固有数词常用于数人、数物、年龄（某些表达）、钟点；汉字数词常用于日期、金额、电话号码、分钟等。学习时先记常见用法。',['사과 두 개','两个苹果。'],'固定搭配很多，不要只按“数量/时间”一刀切。'],['量词前常有缩略','하나 → 한，둘 → 두，셋 → 세，넷 → 네（放在量词前时）。例：한 개、두 명、세 권。',['학생 세 명','三个学生。'],'名词 + 数词 + 量词是常见结构，如 사과 두 개。'],['读时刻：几点几分','小时通常用固有数词，分钟通常用汉字数词：세 시（3点），삼십 분（30分）。3:20 可以说 세 시 이십 분。',['지금 세 시 이십 분이에요.','现在是3点20分。'],'练习时注意固有数词在 시 前也会使用 세、네 等缩略形。']],sentences:[['사과 두 개 주세요.','请给我两个苹果。','量词 개'],['학생 세 명이 있어요.','有三个学生。','量词 명'],['지금 한 시예요.','现在一点。','时刻']],questions:[C('韩语中“两个苹果”更自然写作？',['사과 이 개','사과 두 개','사과 둘 개','사과 이 명'],1,'数物品时通常用固有数词 + 量词，둘 → 두。'),C('“三点钟”应选？',['삼 시','세 시','셋 시','삼 분'],1,'小时用固有数词，셋 在 시 前变 세。'),T('写出韩语“一个”（用于数物品，含量词）','한 개','하나 → 한 + 개。'),O('排列成“请给我两个苹果”',['사과','두 개','주세요'],'사과 두 개 주세요。'),L('지금 한 시예요.',['现在一点。','现在两点。','现在十点。','今天一号。'],0,'한 시 = 一点钟。'),C('分钟常用哪一套数字？',['固有数词','汉字数词','只用英语','不用数词'],1,'分钟主要使用汉字数词，如 이십 분。')]},
{id:'a3',unit:2,title:'地点、起点与终点',subtitle:'에/에서、부터/까지 与日常行程',minutes:23,goals:['区分动作发生地和存在位置','描述去哪里、在哪里做什么','表达从……到……'],words:[['회사','公司','hoesa'],['도서관','图书馆','doseogwan'],['카페','咖啡馆','kape'],['서울','首尔','seoul'],['부산','釜山','busan'],['아침','早晨','achim'],['저녁','晚上','jeonyeok'],['출발하다','出发','chulbalhada'],['도착하다','到达','dochakada'],['일하다','工作','ilhada'],['에서','在（动作地点）；从','eseo'],['까지','直到；到','kkaji']],grammar:[['에 与 에서 有不同职责','에 常表示存在的位置、移动目的地或具体时间：집에 있어요、학교에 가요、세 시에。에서 常标记动作发生的场所：학교에서 공부해요。',['도서관에서 공부해요.','在图书馆学习。'],'“在学校”不能脱离谓语选择 에/에서。'],['에 / 에서 与 이동','去某地通常说 장소 + 에 가요。若强调“从哪里出发”可用 에서：집에서 출발해요。',['회사에 가요.','去公司。'],'要看后面的动词是移动、存在还是在场所内发生动作。'],['부터 / 까지：从……到……','用于时间起点/终点很常见：아홉 시부터 여섯 시까지（9点到6点）。空间起点也常用 에서，终点常用 까지。',['서울에서 부산까지 가요.','从首尔去釜山。'],'不要把 장소의 에서 与 时间의 부터 当作完全相同的助词。']],sentences:[['학교에서 공부해요.','在学校学习。','动作地点 에서'],['아침 아홉 시에 출발해요.','早上九点出发。','时间 에'],['서울에서 부산까지 가요.','从首尔去釜山。','起点到终点']],questions:[C('“在图书馆学习”地点通常用哪个助词？',['에','에서','은','을'],1,'动作发生的场所通常用 에서。'),C('“去学校”通常说？',['학교에서 가요','학교에 가요','학교가 가요','학교를 있어요'],1,'移动目的地通常用 에。'),T('写出表示“到……为止”的助词','까지','까지 可表示终点。'),O('排列成“在咖啡馆学习”',['카페에서','공부해요'],'카페에서 공부해요。'),L('서울에서 부산까지 가요.',['从首尔去釜山。','在首尔吃饭。','釜山到首尔的车。','不去首尔。'],0,'에서 标记起点，까지 标记终点。'),C('表达“从9点到6点”，起点更常用什么？',['부터','까지','를','가'],0,'아홉 시부터 여섯 시까지。')]},
{id:'a4',unit:2,title:'连接动作、愿望与正在进行',subtitle:'-고、-고 싶다、-고 있다',minutes:28,goals:['把两个动作连接起来','表达想做某事','表达正在进行的动作'],words:[['배우다','学习（掌握技能）','baeuda'],['여행하다','旅行','yeohaenghada'],['읽다','读','ikda'],['쓰다','写','sseuda'],['기다리다','等待','gidarida'],['싶다','想要（与 -고 连用）','sipda'],['지금','现在','jigeum'],['주말','周末','jumal'],['한국','韩国','hanguk'],['노래','歌','norae'],['전화하다','打电话','jeonhwahada'],['만나다','见面','mannada']],grammar:[['-고：连接两个动作或状态','动词/形容词词干 + 고，可以连接两个信息；可表示顺序或并列，具体由上下文决定。例：밥을 먹고 공부해요。',['밥을 먹고 공부해요.','吃饭后学习 / 吃饭并学习。'],'고 本身不自动表示“因为”，也不精确规定事件间隔。'],['-고 싶어요：想做……','动词词干 + 고 싶어요，用来表达说话者的愿望。가다 → 가고 싶어요；배우다 → 배우고 싶어요。谈论第三人称愿望还有其他常见表达。',['한국에 가고 싶어요.','我想去韩国。'],'想做的动作是 가다，所以加在 가- 后。'],['-고 있어요：正在……','动词词干 + 고 있어요，常表示动作正在进行：읽고 있어요、공부하고 있어요。对某些状态/姿势动词的解释较特殊，后续再学习。',['지금 책을 읽고 있어요.','现在正在读书。'],'不要把 -고 싶어요（想）与 -고 있어요（正在）混淆。']],sentences:[['한국어를 배우고 싶어요.','我想学韩语。','愿望'],['지금 친구를 기다리고 있어요.','现在正在等朋友。','进行'],['커피를 마시고 책을 읽어요.','喝咖啡然后读书。','连接']],questions:[C('表达“想去韩国”，应选？',['한국에 가고 있어요','한국에 가고 싶어요','한국에 가요 안','한국에 갈 고'],1,'가고 싶어요 = 想去。'),C('“正在读书”选哪句？',['책을 읽고 싶어요','책이 읽어요','책을 읽고 있어요','책을 읽다 고'],2,'읽고 있어요 表示正在读。'),T('翻译“想学韩语”',['한국어를 배우고 싶어요','한국어를 배우고 싶어요.'],'배우다 → 배우고 싶어요。'),O('排列成“现在正在等朋友”',['지금','친구를','기다리고 있어요'],'지금 친구를 기다리고 있어요。'),L('한국어를 배우고 싶어요.',['我会说韩语。','我正在学韩语。','我想学韩语。','我不想学韩语。'],2,'배우고 싶어요 表示想学习。'),C('下列哪个连接词尾一般可连接两个动作？',['-고','-요','-이','-를'],0,'词干 + 고 可连接两个信息。')]}
];
const units=[{name:'韩文字母与发音',sub:'Unit 0 · 从零学会读韩文',icon:'가',desc:'元音、辅音、复合元音、收音。先学会认字，才有能力自己读词。',count:4},{name:'基础韩语语法',sub:'Unit 1 · 建立句子骨架',icon:'✎',desc:'语序、助词、动词、时态、敬语与不规则。理解韩语为什么这样说。',count:8},{name:'综合表达与应用',sub:'Unit 1 延伸 · 生活里用出来',icon:'☕',desc:'自我介绍、数字、时间、地点、愿望与动作连接。',count:4}];
const KEY='hanlab_zh_ko_v1';
const blank=()=>({completed:{},best:{},known:{},stars:{},mistakes:{},activity:{},theme:'light',tests:{}});
function loadState(){try{let old=JSON.parse(localStorage.getItem(KEY)||'null');return old&&typeof old==='object'?{...blank(),...old}:blank()}catch(e){return blank()}}
let state=loadState();
let route='home',studyTab='study',hiddenMeanings=false,wordSearch='',wordFilter='all',reviewFilter='all',reviewIndex=0,reviewRevealed=false,quiz=null,quizSignature='';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFC').toLowerCase().replace(/[\s\u200b\u200c\u200d.,?!。？！、·]/g,'');
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('当前浏览器未允许本地存储，进度可能无法保存。')}}
function dayKey(date=new Date()){const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,'0'),d=String(date.getDate()).padStart(2,'0');return `${y}-${m}-${d}`}
function studyToday(){state.activity[dayKey()]=true;save()}
function streak(){let n=0,d=new Date();if(!state.activity[dayKey(d)])d.setDate(d.getDate()-1);for(let i=0;i<365;i++){if(state.activity[dayKey(d)]){n++;d.setDate(d.getDate()-1)}else break}return n}
function getCompleted(){return lessons.filter(l=>state.completed[l.id]).length}
function getUnitDone(unit){return lessons.filter(l=>l.unit===unit&&state.completed[l.id]).length}
function getAllWords(){const m=new Map();for(const l of lessons)for(const w of l.words)if(!m.has(w[0]))m.set(w[0],{ko:w[0],cn:w[1],roman:w[2]||'',lesson:l});return [...m.values()]}
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;$('#toasts').appendChild(el);setTimeout(()=>el.remove(),2800)}
let koVoice=null;
function pickKoreanVoice(){if(!('speechSynthesis' in window))return null;const voices=speechSynthesis.getVoices();return voices.find(v=>/^ko([-_]|$)/i.test(v.lang)&&v.localService)||voices.find(v=>/^ko([-_]|$)/i.test(v.lang))||null}
if('speechSynthesis' in window){koVoice=pickKoreanVoice();speechSynthesis.addEventListener?.('voiceschanged',()=>{koVoice=pickKoreanVoice()})}
function speak(text){if(!('speechSynthesis' in window)){toast('这个浏览器不支持系统语音朗读。');return}const voice=pickKoreanVoice();if(!voice){toast('未检测到韩语语音包。可在系统语音设置安装“韩语”，然后刷新页面。');return}speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(text);utter.lang='ko-KR';utter.voice=voice;utter.rate=.83;utter.pitch=1;utter.onError=()=>toast('发音未能播放，请检查系统韩语语音包。');speechSynthesis.speak(utter)}
function speakButton(text,label='播放韩语发音'){return `<button class="speak" type="button" title="${esc(label)}" aria-label="${esc(label)}" data-action="speak" data-speak="${encodeURIComponent(text)}">♪</button>`}
const routeHash=()=>decodeURIComponent(location.hash.replace(/^#\/?/,'')||'home');

function closeMenu(){$('#sidebar').classList.remove('open');$('#shade').classList.remove('on')}
function navLinks(){return [['home','⌂','学习首页'],['words','▤','我的词本'],['review','◈','词汇闪卡'],['errors','✎','错题本'],['settings','⚙','学习设置']].map(([id,em,name])=>`<button class="navtop ${route===id?'active':''}" data-go="${id}"><span class="emoji">${em}</span>${name}${id==='errors'&&Object.keys(state.mistakes).length?`<span style="margin-left:auto;font-size:11px">${Object.keys(state.mistakes).length}</span>`:''}</button>`).join('')}
function renderNav(){
 $('#sidebarLinks').innerHTML=navLinks();
 $('#sidebarLessons').innerHTML=units.map((u,uid)=>`<div class="side-heading">${esc(u.sub.split(' · ')[0])} · ${esc(u.name)} <span>${getUnitDone(uid)}/${u.count}</span></div><div class="lesson-list">${lessons.map((l,i)=>l.unit===uid?`<button class="lesson-link ${route.startsWith('lesson/'+l.id)?'active':''} ${state.completed[l.id]?'done':''}" data-go="lesson/${l.id}/study" title="${esc(l.title)}"><span class="lesson-num">${state.completed[l.id]?'✓':String(i+1).padStart(2,'0')}</span><span>${esc(l.title)}</span>${state.completed[l.id]?'<span class="done-mark">✓</span>':''}</button>`:'').join('')}</div>`).join('');
 $('#sideProgress').innerHTML=`<b>🌱 我的学习轨迹</b><div class="mini-progress"><div style="width:${getCompleted()/lessons.length*100}%"></div></div><p>${getCompleted()} / ${lessons.length} 课已完成 · 数据自动保存在本机</p>`;
 $('#topStreak').textContent=`🔥 连续学习 ${streak()} 天`;
 $('#themeButton').textContent=state.theme==='dark'?'☀':'☾';
 document.body.classList.toggle('dark',state.theme==='dark');
}
function progressBar(cur,total){return `<div class="bar"><div style="width:${total?Math.round(cur/total*100):0}%"></div></div>`}
function renderHome(){
 const completed=getCompleted(),pct=Math.round(completed/lessons.length*100),next=lessons.find(l=>!state.completed[l.id])||lessons[lessons.length-1];
 return `<div class="hero"><div class="hero-copy"><div class="hero-kicker">你好，未来的韩语达人 · 안녕하세요!</div><h1>从 <em>가나다</em> 开始，<br>把韩语真正学明白。</h1><p>不靠机械背句子。先学会读字，再理解语法结构，接着通过词卡、发音和小测验把知识练熟。</p><button class="btn btn-light" data-go="lesson/${next.id}/study">${completed?'继续学习':'开始第一课'} <span>↗</span></button></div><div class="ring" style="--percent:${pct}"><div class="ring-content"><b>${pct}%</b><small>整体课程进度</small></div></div></div>
 <div class="stats"><div class="stat"><span class="stat-icon">📚</span><b>${completed}<span style="font-size:13px;color:var(--muted);font-weight:600"> / ${lessons.length}</span></b><small>已完成课程</small></div><div class="stat"><span class="stat-icon">✨</span><b>${Object.keys(state.known).filter(k=>state.known[k]).length}</b><small>已掌握词汇</small></div><div class="stat"><span class="stat-icon">🎯</span><b>${Object.keys(state.mistakes).length}</b><small>需要复习的错题</small></div></div>
 <div class="section-head"><div><h2>你的学习路线</h2><p>循序渐进的三阶段课程，点击进入各单元</p></div><span class="tag">共 ${lessons.length} 课 · ${getAllWords().length} 个不同词条</span></div>
 <div class="course-grid">${units.map((u,i)=>`<div class="course-card"><div class="course-icon">${u.icon}</div><small class="eyebrow" style="letter-spacing:1px;font-size:10px">${esc(u.sub)}</small><h3>${esc(u.name)}</h3><p>${esc(u.desc)}</p><div style="margin-top:auto">${progressBar(getUnitDone(i),u.count)}<div class="foot" style="margin-top:15px"><span>${getUnitDone(i)} / ${u.count} 课已完成</span><button class="text-link" data-go="unit/${i}">进入课程 →</button></div></div></div>`).join('')}</div>
 <div class="section-head"><div><h2>今日建议</h2><p>每天 15～25 分钟，先理解再巩固</p></div></div><div class="two-cols"><div class="panel"><div class="eyebrow">NEXT UP · 下一步</div><h3 style="font-size:21px;margin:10px 0 6px">${esc(next.title)}</h3><p class="sub">${esc(next.subtitle)}</p><div style="margin:19px 0;display:flex;gap:9px;flex-wrap:wrap"><span class="tag">约 ${next.minutes} 分钟</span><span class="tag">${next.words.length} 个词条</span><span class="tag">${next.questions.length} 道互动练习</span></div><button class="btn" data-go="lesson/${next.id}/study">进入这一课 ↗</button></div><div class="panel"><div class="daily"><div class="tiny">STUDY ROUTINE · 每日微计划</div><h3>认识 → 理解 → 练习</h3><p>① 听读本课词汇 ② 阅读语法与例句 ③ 完成小测验，80% 达标。错题自动进入错题本。</p><button class="btn btn-sm btn-ghost" data-go="review">随机复习词汇 →</button></div></div></div>
 <div class="section-head"><div><h2>阶段测验</h2><p>每个单元的知识点随机抽题，检测掌握程度</p></div></div><div class="course-grid">${units.map((u,i)=>`<div class="panel"><div class="eyebrow">UNIT 0${i} CHECKPOINT</div><h3 style="margin:9px 0">${esc(u.name)} · 单元测试</h3><p class="sub" style="font-size:12px;margin-bottom:14px">随机抽取本单元 ${Math.min(12,lessons.filter(l=>l.unit===i).reduce((a,l)=>a+l.questions.length,0))} 道题；答对 80% 通过。</p>${state.tests[i]!==undefined?`<div style="font-size:12px;color:var(--teal);margin-bottom:8px">历史最高：${state.tests[i]}%</div>`:''}<button class="btn btn-ghost btn-sm" data-go="test/${i}">开始测试 →</button></div>`).join('')}</div>`;
}
function renderUnit(idx){const u=units[idx];if(!u)return renderHome();const group=lessons.filter(l=>l.unit===idx);return `<div class="eyebrow">${esc(u.sub)}</div><h1 class="h1">${esc(u.name)}</h1><p class="sub">${esc(u.desc)}</p><div class="panel" style="margin-top:22px"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px"><b>本单元进度</b><b style="color:var(--teal)">${getUnitDone(idx)}/${u.count} 课</b></div>${progressBar(getUnitDone(idx),u.count)}</div><div style="display:grid;gap:12px;margin-top:19px">${group.map((l,j)=>`<div class="panel" style="display:flex;justify-content:space-between;align-items:center;gap:18px"><div><div class="eyebrow" style="font-size:10px">LESSON ${String(j+1).padStart(2,'0')} · ${l.minutes} MIN ${state.completed[l.id]?' · ✓ 已达标':''}</div><h3 style="margin:4px 0 2px">${esc(l.title)}</h3><div class="sub" style="font-size:12px">${esc(l.subtitle)}</div></div><button class="btn btn-ghost btn-sm" data-go="lesson/${l.id}/study">${state.completed[l.id]?'复习':'学习'} →</button></div>`).join('')}</div><div style="margin-top:22px"><button class="btn" data-go="test/${idx}">参加单元测试 ↗</button></div>`}
function lessonTabBar(l,active){return `<div class="lesson-tabs">${[['study','📖 语法与例句'],['vocab','🗂 词汇训练'],['quiz','✎ 课后练习']].map(([id,n])=>`<button class="tab ${active===id?'active':''}" data-go="lesson/${l.id}/${id}">${n}</button>`).join('')}</div>`}
function renderLesson(id,tab){const l=lessons.find(l=>l.id===id);if(!l)return renderHome();const idx=lessons.indexOf(l);const done=state.completed[id];let body='';
 if(tab==='vocab'){body=`<div class="toolbar"><div><h2 style="margin:0;font-size:19px">本课词汇 · ${l.words.length} 个</h2><small style="color:var(--muted)">点击发音，配合“认识了”按钮建立个人词库</small></div><button class="toggle ${hiddenMeanings?'selected':''}" data-action="hideMeaning">${hiddenMeanings?'👁 显示中文':'🙈 隐藏中文自测'}</button></div><div class="word-grid">${l.words.map((w,i)=>wordCard(w,i)).join('')}</div><div class="lesson-bottom"><button class="btn btn-ghost" data-go="lesson/${l.id}/study">← 返回语法</button><button class="btn" data-go="lesson/${l.id}/quiz">做课后练习 ↗</button></div>`}
 else if(tab==='quiz'){ensureQuiz('lesson',id);body=renderQuiz()}
 else {body=`<div class="study-layout"><div><div class="panel" style="margin-bottom:15px"><div class="eyebrow">TODAY'S GOALS · 本课目标</div><div class="objectives">${l.goals.map(x=>`<div class="objective">${esc(x)}</div>`).join('')}</div></div><div class="section-head" style="margin-top:21px"><h2>知识点拆解</h2><span class="tag">${l.grammar.length} 个核心概念</span></div>${l.grammar.map((g,i)=>`<section class="grammar"><div class="grammar-head"><h3>${esc(g[0])}</h3><span class="grammar-num">${String(i+1).padStart(2,'0')}</span></div><p>${esc(g[1])}</p><div class="example"><div><span class="ko" lang="ko">${esc(g[2][0])}</span><div class="cn">${esc(g[2][1])}</div></div>${speakButton(g[2][0])}</div><div style="font-size:12px;color:var(--teal);margin-top:12px">💡 ${esc(g[3])}</div></section>`).join('')}<div class="section-head"><h2>跟读例句</h2><span class="tag">听读结合</span></div><div class="panel" style="padding:9px 22px">${l.sentences.map((s,i)=>`<div style="padding:17px 0;display:flex;gap:16px;align-items:center;justify-content:space-between;${i?'border-top:1px solid var(--line)':''}"><div><div style="font-size:20px;font-weight:760" lang="ko">${esc(s[0])}</div><div class="sub" style="font-size:12px">${esc(s[1])} · ${esc(s[2])}</div></div>${speakButton(s[0])}</div>`).join('')}</div><div class="lesson-bottom"><button class="btn btn-ghost" data-go="lesson/${l.id}/vocab">先背单词 →</button><button class="btn" data-go="lesson/${l.id}/quiz">开始练习 ↗</button></div></div><aside class="lesson-side"><div class="note"><strong>🌿 学习方法</strong>这一课不需要一次背完所有规则。<br>先读示例并点击 ♪ 听发音，然后切换到词汇卡，最后完成练习。<br><br>本课测验达到 80% 便会记录为已完成。</div><div class="panel" style="margin-top:14px;padding:18px"><div class="eyebrow">LESSON SNAPSHOT</div><h3 style="font-size:23px;margin:6px 0 0">${l.words.length} <small style="font-size:12px;color:var(--muted)">个词条</small></h3><p class="sub" style="font-size:12px">${l.questions.length} 道练习 · 约 ${l.minutes} 分钟</p><div style="margin-top:15px">${done?'<span class="tag">✓ 已通过本课</span>':'<span class="tag">尚未通过测验</span>'}</div></div></aside></div>`}
 return `<div class="lesson-banner"><div><div class="eyebrow">${esc(units[l.unit].sub)} · LESSON ${idx+1}</div><h1>${esc(l.title)}</h1><p>${esc(l.subtitle)}</p></div><span class="tag">${done?'✓ 已达标':'约 '+l.minutes+' 分钟'}</span></div>${lessonTabBar(l,tab)}${body}`;
}
function wordCard(w,i){const [ko,cn,roman]=w;return `<div class="word-card"><div style="display:flex;justify-content:space-between;align-items:center"><small style="color:var(--muted);font-weight:760">WORD ${String(i+1).padStart(2,'0')}</small><button class="tiny-btn star ${state.stars[ko]?'on':''}" data-action="star" data-ko="${encodeURIComponent(ko)}" title="收藏这个词" aria-label="收藏 ${esc(ko)}">${state.stars[ko]?'★':'☆'}</button></div><div class="word-ko" lang="ko">${esc(ko)}</div><div class="word-cn ${hiddenMeanings?'hidden-meaning':''}">${esc(cn)}</div><div class="word-roman">${esc(roman||'')}</div><div class="word-actions">${speakButton(ko)}<button class="tiny-btn ${state.known[ko]?'on':''}" data-action="know" data-ko="${encodeURIComponent(ko)}">${state.known[ko]?'✓ 已掌握':'＋ 认识了'}</button></div></div>`}
function ensureQuiz(mode,id){let signature=mode+':'+id;if(quiz&&quizSignature===signature)return;let items=[];
 if(mode==='lesson'){const l=lessons.find(x=>x.id===id);if(l)items=l.questions.map((q,i)=>({q,lesson:l,qIndex:i}));}
 else if(mode==='unit'){const pool=lessons.filter(l=>l.unit===Number(id)).flatMap(l=>l.questions.map((q,i)=>({q,lesson:l,qIndex:i})));items=shuffle(pool).slice(0,Math.min(12,pool.length));}
 else if(mode==='mistakes'){items=Object.keys(state.mistakes).map(k=>{const [lid,qi]=k.split(':');const l=lessons.find(x=>x.id===lid);return l&&l.questions[Number(qi)]?{q:l.questions[Number(qi)],lesson:l,qIndex:Number(qi)}:null}).filter(Boolean);items=shuffle(items);}
 quiz={mode,id,items,index:0,correct:0,answered:false,selected:null,order:[],shuffled:null,finished:false};quizSignature=signature;
}
function shuffle(a){const arr=[...a];for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function currentQuestion(){return quiz&&quiz.items[quiz.index]}
function renderQuiz(){if(!quiz||!quiz.items.length)return `<div class="empty"><div class="big">🎉</div><h3>现在没有需要做的题</h3><p>错题本是空的，继续学习课程吧。</p><button class="btn" data-go="home">返回首页</button></div>`;if(quiz.finished||quiz.index>=quiz.items.length)return renderFinish();
 const {q,lesson}=currentQuestion(),total=quiz.items.length,done=quiz.index,pct=Math.round(done/total*100);if(q.type==='order'&&!quiz.shuffled){let arr=shuffle(q.tokens.map((_,i)=>i));if(arr.length>1&&arr.every((x,i)=>x===i))arr.reverse();quiz.shuffled=arr}
 let answerHTML='';
 if(q.type==='choice'||q.type==='listen')answerHTML=`<div class="options">${q.options.map((option,i)=>`<button class="option ${quiz.answered?(i===q.answer?'correct':i===quiz.selected?'wrong':''):''}" data-action="choose" data-choice="${i}" ${quiz.answered?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(option)}</span></button>`).join('')}</div>`;
 else if(q.type==='write')answerHTML=`<input class="answer-input" id="answerInput" autocomplete="off" spellcheck="false" lang="ko" placeholder="在此输入韩语答案（可忽略句末标点和空格）" ${quiz.answered?'disabled':''}><p class="question-hint">输入韩文字母或完整句子。按 Enter 提交；不区分空格和句末标点。</p>`;
 else if(q.type==='order'){answerHTML=`<div class="question-hint" style="margin-bottom:9px">已选择的顺序（点击可以撤回）</div><div class="tokens">${quiz.order.length?quiz.order.map((ix,pos)=>`<button class="token placed" data-action="undoToken" data-pos="${pos}">${esc(q.tokens[ix])} ×</button>`).join(''):'<small style="color:var(--muted)">点击下方词块组句…</small>'}</div><div class="question-hint" style="margin-bottom:9px">待选词块</div><div class="tokens">${quiz.shuffled.map(ix=>`<button class="token" data-action="pickToken" data-idx="${ix}" ${quiz.order.includes(ix)||quiz.answered?'disabled':''}>${esc(q.tokens[ix])}</button>`).join('')}</div>`}
 let f='';if(quiz.answered){const correctAnswer=q.type==='choice'||q.type==='listen'?q.options[q.answer]:q.type==='write'?q.answers[0]:q.tokens.join(' ');f=`<div class="feedback ${quiz.right?'':'bad'}"><strong>${quiz.right?'✓ 答对啦！':'↻ 再记住这一点'} ${quiz.right?'':'正确答案：'+esc(correctAnswer)}</strong>${esc(q.why)}</div>`}
 return `<div class="quiz-wrap"><div class="quiz-top"><span>${quiz.mode==='unit'?'🏁 单元测验':quiz.mode==='mistakes'?'🎯 错题复习':'✏️ 本课练习'} · 第 ${done+1} / ${total} 题 ${quiz.mode!=='lesson'?'<span style="opacity:.7">· '+esc(lesson.title)+'</span>':''}</span><span class="score">正确 ${quiz.correct} 题</span></div><div class="quiz-progress"><div style="width:${pct}%"></div></div><div class="question-card"><div class="question-type">${{choice:'SINGLE CHOICE · 单项选择',listen:'LISTENING · 听力辨义',write:'TYPING · 韩文输入',order:'BUILD A SENTENCE · 拼句'}[q.type]}</div><h2>${esc(q.p)}</h2>${q.type==='listen'?`<div style="display:flex;align-items:center;gap:12px;margin:-8px 0 22px;padding:12px;background:var(--surface2);border-radius:12px">${speakButton(q.audio,'重播听力句子')}<span style="color:var(--muted);font-size:12px">点击 ♪ 听句子，然后选出中文意思</span></div>`:''}${answerHTML}${f}<div class="quiz-actions"><button class="text-link" data-action="quitQuiz">← ${quiz.mode==='lesson'?'返回课程':'返回首页'}</button>${q.type==='write'||q.type==='order'?`<button class="btn" data-action="checkQuiz" ${quiz.answered?'disabled':''}>检查答案</button>`:''}${quiz.answered?`<button class="btn" data-action="nextQuiz">${done===total-1?'查看成绩':'下一题 →'}</button>`:''}</div></div></div>`;
}
function renderFinish(){const total=quiz.items.length,percent=Math.round(quiz.correct/total*100),passed=percent>=80;
 return `<div class="quiz-wrap"><div class="finish"><div class="medal">${passed?'🏆':'📘'}</div><h2>${passed?'太棒了，这一轮达标！':'练习完成，继续巩固就好'}</h2><div class="giant">${percent}%</div><p>答对 ${quiz.correct} / ${total} 题 · ${passed?'已达到 80% 目标':'建议再练一轮，达到 80% 即可通关'}</p><div class="finish-actions"><button class="btn btn-ghost" data-action="retryQuiz">再做一次 ↻</button>${quiz.mode==='lesson'?`<button class="btn" data-go="lesson/${quiz.id}/vocab">复习本课词汇 →</button><button class="btn btn-ghost" data-go="${lessons.findIndex(l=>l.id===quiz.id)<lessons.length-1?'lesson/'+lessons[lessons.findIndex(l=>l.id===quiz.id)+1].id+'/study':'home'}">${lessons.findIndex(l=>l.id===quiz.id)<lessons.length-1?'进入下一课 →':'课程首页 →'}</button>`:'<button class="btn" data-go="home">返回课程首页 ↗</button>'}</div></div></div>`
}
function recordFinish(){if(!quiz||quiz.finished)return;quiz.finished=true;const total=quiz.items.length,percent=Math.round(quiz.correct/total*100);if(quiz.mode==='lesson'){const id=quiz.id;state.best[id]=Math.max(state.best[id]||0,percent);if(percent>=80){state.completed[id]=true;toast('🎉 恭喜！本课已达标，进度已保存。')}else toast('练习已完成，可以再试一次提高正确率。')}else if(quiz.mode==='unit'){state.tests[quiz.id]=Math.max(state.tests[quiz.id]||0,percent);toast(percent>=80?'🎉 单元测试通过！':'单元测试已完成，建议继续复习。')}else toast('错题复习完成。');studyToday()}
function checkQuiz(choice){if(!quiz||quiz.finished||quiz.answered)return;const item=currentQuestion(),q=item.q;let right=false;
 if(q.type==='choice'||q.type==='listen'){if(choice===undefined)return;quiz.selected=choice;right=choice===q.answer}
 else if(q.type==='write'){const x=$('#answerInput');if(!x||!x.value.trim()){toast('请先填写答案。');return}right=q.answers.some(a=>norm(a)===norm(x.value));quiz.typed=x.value}
 else if(q.type==='order'){if(quiz.order.length!==q.tokens.length){toast('请先选完全部词块。');return}const got=quiz.order.map(i=>q.tokens[i]).join('');right=norm(got)===norm(q.tokens.join(''))}
 quiz.answered=true;quiz.right=right;if(right)quiz.correct++;const key=item.lesson.id+':'+item.qIndex;if(right)delete state.mistakes[key];else state.mistakes[key]={at:Date.now()};studyToday();render();
}
function nextQuiz(){if(!quiz||!quiz.answered)return;quiz.index++;quiz.answered=false;quiz.selected=null;quiz.order=[];quiz.shuffled=null;if(quiz.index>=quiz.items.length)recordFinish();render()}
function renderWords(){const words=getAllWords().filter(w=>(wordFilter==='all'||wordFilter==='star'&&state.stars[w.ko]||wordFilter==='known'&&state.known[w.ko]||wordFilter==='new'&&!state.known[w.ko])&&(!wordSearch||[w.ko,w.cn,w.roman,w.lesson.title].some(x=>x.includes(wordSearch))));return `<div class="eyebrow">MY VOCABULARY · 个人词库</div><h1 class="h1">把每一个单词变成你的词汇量。</h1><p class="sub">所有课程词汇集中在这里；你可以收藏、标记已掌握、搜索与按状态筛选。</p><div class="toolbar" style="margin-top:26px"><input class="searchbox" id="wordSearch" placeholder="搜索韩文、中文意思或课程…" value="${esc(wordSearch)}"><div style="display:flex;gap:7px;flex-wrap:wrap">${[['all','全部'],['new','未掌握'],['known','已掌握'],['star','☆ 收藏']].map(([key,t])=>`<button class="toggle ${wordFilter===key?'selected':''}" data-action="wordFilter" data-filter="${key}">${t}</button>`).join('')}</div></div><div class="sub" style="font-size:12px;margin:0 0 12px">符合条件 ${words.length} 个 · 全部词条 ${getAllWords().length} 个</div>${words.length?`<div class="word-grid">${words.map((w,i)=>wordCard([w.ko,w.cn,w.roman],i)).join('')}</div>`:`<div class="empty"><div class="big">🔎</div><h3>还没有符合条件的词条</h3><p>可以换个搜索词或切换筛选。</p><button class="btn btn-sm" data-action="clearWordSearch">重置搜索</button></div>`}<div style="margin-top:18px"><button class="btn" data-go="review">用闪卡复习词汇 ↗</button></div>`}
function filteredReviewWords(){return getAllWords().filter(w=>reviewFilter==='all'||reviewFilter==='star'&&state.stars[w.ko]||reviewFilter==='new'&&!state.known[w.ko])}
function renderReview(){const words=filteredReviewWords();if(reviewIndex>=words.length)reviewIndex=0;const w=words[reviewIndex];return `<div class="eyebrow">FLASHCARDS · 单词抽查</div><h1 class="h1">用闪卡检验记忆</h1><p class="sub">先看韩文，自己回忆中文意思，点击卡片翻面。认识的词可以打勾。</p><div class="toolbar" style="margin-top:23px;justify-content:flex-start">${[['all','全部词汇'],['new','未掌握'],['star','我的收藏']].map(([id,label])=>`<button class="toggle ${reviewFilter===id?'selected':''}" data-action="reviewFilter" data-filter="${id}">${label}</button>`).join('')}</div>${w?`<div class="review-layout"><div><div class="flip-card" data-action="flipCard" role="button" tabindex="0" aria-label="翻转单词卡"><div class="eyebrow">${reviewRevealed?'ANSWER · 中文释义':'KOREAN · 猜猜意思'}</div><div class="front-ko" lang="ko">${esc(w.ko)}</div>${reviewRevealed?`<div class="flip-meaning">${esc(w.cn)}</div><div style="color:var(--muted);font-size:12px">${esc(w.roman)} · 来自 ${esc(w.lesson.title)}</div>`:''}<div class="flip-foot">${reviewRevealed?'点击卡片，隐藏答案':'点击卡片，揭晓意思'} ↻</div></div><div class="review-ctrl"><button class="btn btn-ghost" data-action="reviewPrev">← 上一个</button><button class="btn btn-ghost" data-action="reviewSpeak">♪ 播放发音</button><button class="btn" data-action="reviewKnow">${state.known[w.ko]?'✓ 已掌握':'✓ 我认识了'}</button><button class="btn btn-ghost" data-action="reviewNext">下一个 →</button></div><p class="review-info">第 ${reviewIndex+1} / ${words.length} 张 · 进度只在当前浏览器保存</p></div><div class="panel"><div class="eyebrow">HOW TO REVIEW</div><h3>每张卡分三步</h3><ol class="tip-list"><li><strong>先看韩文</strong>，不要急着翻面。</li><li><strong>点 ♪ 听发音</strong>，尝试跟读。</li><li><strong>翻开答案</strong>，如果记住了，点“我认识了”。</li></ol><div style="margin-top:18px" class="note"><strong>重复记忆</strong>先复习“未掌握”，再挑战“全部词汇”。收藏适合容易混淆的词。</div></div></div>`:`<div class="empty"><div class="big">🎈</div><h3>这个分类还没有词汇</h3><p>试着切换到“全部词汇”。</p><button class="btn" data-action="reviewFilter" data-filter="all">查看全部</button></div>`}`}
function renderSettings(){return `<div class="eyebrow">SETTINGS · 数据与发音</div><h1 class="h1">学习设置</h1><p class="sub">这是一份无需登录、无需联网的单文件学习应用。课程是内置的，学习记录存在当前浏览器里。</p><div class="two-cols" style="margin-top:25px"><div class="panel"><h3>📦 备份与恢复学习记录</h3><p class="sub" style="font-size:12px;margin-bottom:17px">换浏览器、换电脑或者清理浏览器数据时，可通过 JSON 备份迁移已完成课程、词汇状态、错题和测验成绩。</p><div style="display:flex;flex-wrap:wrap;gap:10px"><button class="btn btn-sm" data-action="exportBackup">↓ 导出进度备份</button><button class="btn btn-ghost btn-sm" data-action="importBackup">↑ 导入进度备份</button></div><input id="backupFile" type="file" accept=".json,application/json" hidden><div style="margin-top:17px;color:var(--muted);font-size:12px">当前数据：${getCompleted()} / ${lessons.length} 课完成，${Object.keys(state.mistakes).length} 道错题。</div></div><div class="panel"><h3>♪ 韩语发音设置</h3><p class="sub" style="font-size:12px;line-height:2">发音调用设备中的韩语语音合成引擎（ko-KR），不是预先录制的母语者音频。如果按钮无法发音，通常需要在 Windows/macOS/Android 的语音设置中安装或启用韩语语音，再刷新本页。</p><button class="btn btn-ghost btn-sm" data-action="soundTest">♪ 测试韩语发音</button></div></div><div class="panel" style="margin-top:18px;border-color:#efc1bc"><h3>清空学习记录</h3><p class="sub" style="font-size:12px;margin-bottom:13px">会删除当前浏览器中的课程完成记录、收藏词汇、错题和成绩。建议先导出备份。</p><button class="btn btn-ghost btn-sm" style="color:#c25e56" data-action="resetProgress">清空全部记录</button></div>`}
function renderErrors(){const entries=Object.keys(state.mistakes).map(k=>{const [lid,n]=k.split(':');const l=lessons.find(x=>x.id===lid);return l&&l.questions[Number(n)]?{key:k,q:l.questions[Number(n)],l}:null}).filter(Boolean);return `<div class="eyebrow">ERROR NOTEBOOK · 查漏补缺</div><h1 class="h1">错题本</h1><p class="sub">在课程练习中答错的题，会自动收集在这里。重新答对后，便会自动移出错题本。</p>${entries.length?`<div class="panel" style="margin-top:24px"><div style="display:flex;gap:15px;align-items:center;justify-content:space-between;flex-wrap:wrap"><div><h3 style="font-size:23px;margin:0">${entries.length} 道待巩固错题</h3><p class="sub" style="font-size:12px">重新练习时将随机排列顺序</p></div><button class="btn" data-go="errors/practice">开始错题专项训练 ↗</button></div></div><div style="display:grid;gap:12px;margin-top:16px">${entries.map(e=>`<div class="panel" style="display:flex;gap:13px;align-items:flex-start;justify-content:space-between"><div><div class="eyebrow">${esc(e.l.title)}</div><b style="font-size:15px">${esc(e.q.p)}</b><p class="sub" style="font-size:12px;margin-top:6px">考点：${esc(e.q.why)}</p></div><button class="btn btn-sm btn-ghost" data-go="lesson/${e.l.id}/quiz">回到本课 →</button></div>`).join('')}</div>`:`<div class="empty" style="margin-top:25px"><div class="big">✨</div><h3>暂时没有错题</h3><p>开始做一课练习，答错的题目会自动出现在这里。</p><button class="btn" data-go="home">去学新课 ↗</button></div>`}`}
function renderMain(){if(route==='home')return renderHome();if(route==='words')return renderWords();if(route==='settings')return renderSettings();if(route==='review')return renderReview();if(route==='errors')return renderErrors();if(route==='errors/practice'){ensureQuiz('mistakes','all');return `<div class="eyebrow">PRACTICE · 查漏补缺</div><h1 class="h1">错题专项训练</h1>${renderQuiz()}`};if(route.startsWith('unit/')){const idx=Number(route.split('/')[1]);return renderUnit(idx)}if(route.startsWith('test/')){const idx=Number(route.split('/')[1]);if(!units[idx])return renderHome();ensureQuiz('unit',idx);return `<div class="eyebrow">UNIT CHECKPOINT</div><h1 class="h1">${esc(units[idx].name)} · 单元测试</h1><p class="sub" style="margin-bottom:26px">随机抽题 · 答对 80% 达标 · 可重复测试</p>${renderQuiz()}`};if(route.startsWith('lesson/')){const [_,id,tab='study']=route.split('/');studyTab=['study','vocab','quiz'].includes(tab)?tab:'study';return renderLesson(id,studyTab)}return renderHome()}
function breadcrumbs(){if(route==='home')return '学习总览';if(route==='words')return '我的词本';if(route==='settings')return '学习设置';if(route==='review')return '词汇闪卡';if(route.startsWith('errors'))return '错题本';if(route.startsWith('unit/'))return units[Number(route.split('/')[1])]?.name||'课程';if(route.startsWith('test/'))return '单元测验';if(route.startsWith('lesson/'))return lessons.find(l=>l.id===route.split('/')[1])?.title||'课程';return '学习总览'}
function render(){renderNav();$('#breadcrumb').innerHTML=`课程主页 / <strong>${esc(breadcrumbs())}</strong>`;$('#appContent').innerHTML=renderMain()}
function bootRoute(){route=routeHash();if(!route)route='home';if(route!=='words')wordSearch='';if(!route.includes('/quiz')&&!route.startsWith('test/')&&route!=='errors/practice'){quiz=null;quizSignature=''}render();window.scrollTo({top:0,behavior:'instant'})}
window.addEventListener('hashchange',bootRoute);
$('#shade').addEventListener('click',closeMenu);
function advanceReview(dir){let len=filteredReviewWords().length;if(!len)return;reviewIndex=(reviewIndex+dir+len)%len;reviewRevealed=false;render()}
function toggleKnow(ko){if(state.known[ko])delete state.known[ko];else {state.known[ko]=true;studyToday()}save();render()}
function toggleStar(ko){if(state.stars[ko])delete state.stars[ko];else state.stars[ko]=true;save();render()}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-action],[data-go]');if(!el)return;
 if(el.hasAttribute('data-go')){go(el.dataset.go);return}
 switch(el.dataset.action){
 case 'menu':$('#sidebar').classList.toggle('open');$('#shade').classList.toggle('on');break;
 case 'home':go('home');break;
 case 'theme':state.theme=state.theme==='dark'?'light':'dark';save();render();break;
 case 'soundTest':speak('안녕하세요. 한국어를 함께 공부해요.');break;
 case 'exportBackup':{const blob=new Blob([JSON.stringify({format:'hanlab-progress',version:1,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='韩语研究所_学习进度_'+dayKey()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('学习记录已导出为 JSON 备份。');break}
 case 'importBackup':$('#backupFile')?.click();break;
 case 'resetProgress':if(confirm('确定清空所有学习记录吗？此操作不可撤销，建议先导出备份。')){state=blank();save();quiz=null;quizSignature='';toast('当前浏览器的学习记录已清空。');go('home')}break;
 case 'speak':speak(decodeURIComponent(el.dataset.speak));break;
 case 'hideMeaning':hiddenMeanings=!hiddenMeanings;render();break;
 case 'know':toggleKnow(decodeURIComponent(el.dataset.ko));break;
 case 'star':toggleStar(decodeURIComponent(el.dataset.ko));break;
 case 'wordFilter':wordFilter=el.dataset.filter;render();break;
 case 'clearWordSearch':wordSearch='';wordFilter='all';render();break;
 case 'reviewFilter':reviewFilter=el.dataset.filter;reviewIndex=0;reviewRevealed=false;render();break;
 case 'flipCard':reviewRevealed=!reviewRevealed;render();break;
 case 'reviewPrev':advanceReview(-1);break;
 case 'reviewNext':advanceReview(1);break;
 case 'reviewSpeak':{const w=filteredReviewWords()[reviewIndex];if(w)speak(w.ko);break}
 case 'reviewKnow':{const w=filteredReviewWords()[reviewIndex];if(w){const wasKnown=!!state.known[w.ko];if(!wasKnown){state.known[w.ko]=true;studyToday();toast('✓ 已加入掌握词汇')}else{delete state.known[w.ko];save()}const len=filteredReviewWords().length;if(reviewFilter==='new'){if(reviewIndex>=len)reviewIndex=0}else if(len>1){reviewIndex=(reviewIndex+1)%len}reviewRevealed=false;render()}break}
 case 'choose':checkQuiz(Number(el.dataset.choice));break;
 case 'checkQuiz':checkQuiz();break;
 case 'nextQuiz':nextQuiz();break;
 case 'pickToken':if(quiz&&!quiz.answered){let ix=Number(el.dataset.idx);if(!quiz.order.includes(ix)){quiz.order.push(ix);render()}}break;
 case 'undoToken':if(quiz&&!quiz.answered){quiz.order.splice(Number(el.dataset.pos),1);render()}break;
 case 'quitQuiz':go(quiz&&quiz.mode==='lesson'?`lesson/${quiz.id}/study`:'home');break;
 case 'retryQuiz':{const mode=quiz.mode,id=quiz.id;quiz=null;quizSignature='';ensureQuiz(mode,id);render();break}
 }
});
document.addEventListener('input',e=>{if(e.target.id==='wordSearch'){const pos=e.target.selectionStart;wordSearch=e.target.value;const root=$('#appContent');root.innerHTML=renderWords();const input=$('#wordSearch');if(input){input.focus();input.setSelectionRange(pos,pos)}}});
document.addEventListener('change',async e=>{if(e.target.id!=='backupFile')return;const f=e.target.files?.[0];if(!f)return;try{if(f.size>2e6)throw new Error('备份文件过大');const obj=JSON.parse(await f.text());if(obj.format!=='hanlab-progress'||obj.version!==1||!obj.data||typeof obj.data!=='object')throw new Error('不是有效的韩语研究所备份');const restored=blank();for(const field of ['completed','best','known','stars','mistakes','activity','tests'])if(obj.data[field]&&typeof obj.data[field]==='object'&&!Array.isArray(obj.data[field]))restored[field]=obj.data[field];restored.theme=obj.data.theme==='dark'?'dark':'light';state=restored;save();quiz=null;quizSignature='';render();toast('✓ 已恢复学习进度。')}catch(err){toast('导入失败：'+err.message)}finally{e.target.value=''}});
document.addEventListener('keydown',e=>{if(e.target.id==='answerInput'&&e.key==='Enter'){e.preventDefault();checkQuiz()}if(e.target.classList.contains('flip-card')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();reviewRevealed=!reviewRevealed;render()} });
bootRoute();
</script>
</body>
</html>
